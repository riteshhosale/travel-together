name: Build and Publish Docker Images

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/travel-together-backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/travel-together-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/client
          file: ./frontend/client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/travel-together-frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/travel-together-frontend:latest

      - name: Update deployment manifest with new backend image tag
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          MANIFEST_PATH="frontend/deploy/backend-deployment.yaml"
          test -f "$MANIFEST_PATH"
          sed -i -E "s|image: .*travel-together-backend:.*|image: ghcr.io/${IMAGE_OWNER}/travel-together-backend:${IMAGE_TAG}|g" "$MANIFEST_PATH"

      - name: Create pull request for deployment manifest
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/update-backend-image-${{ env.IMAGE_TAG }}
          title: "ci: update backend image to ${{ env.IMAGE_TAG }}"
          body: "Automated deployment manifest update for backend image ${{ env.IMAGE_TAG }}."
          base: main
          commit-message: "ci: update backend image to ${{ env.IMAGE_TAG }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.ENABLE_KUBERNETES_DEPLOY == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "${KUBE_CONFIG_DATA:-}" ]; then
            echo "KUBE_CONFIG secret is not set; skipping deployment";
            exit 1;
          fi
          echo "Decoding kubeconfig..."
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > kubeconfig
          mkdir -p ~/.kube
          mv kubeconfig ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.3'

      - name: Deploy backend manifest
        run: |
          kubectl apply -f frontend/deploy/backend-deployment.yaml
          kubectl set image deployment/travel-together-backend backend=ghcr.io/${{ github.repository_owner }}/travel-together-backend:${{ github.sha }}
          kubectl rollout status deployment/travel-together-backend --timeout=120s

