apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-together-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-together-backend
  template:
    metadata:
      labels:
        app: travel-together-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: backend
          # Image will be updated by CI to a specific tag. Replace or configure as needed.
          image: ghcr.io/riteshhosale/travel-together-backend:19cd0d0905d7a388645520664b3533cf952f957c
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
