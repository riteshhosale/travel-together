name: Build and Publish Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/travel-together-backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/travel-together-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/client
          file: ./frontend/client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/travel-together-frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/travel-together-frontend:latest

      - name: Update deployment manifest with new backend image tag
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "s|image: .*travel-together-backend:.*|image: ghcr.io/${IMAGE_OWNER}/travel-together-backend:${IMAGE_TAG}|g" deploy/backend-deployment.yaml
          git add deploy/backend-deployment.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            BRANCH="ci/update-backend-image-${IMAGE_TAG}"
            git checkout -b "${BRANCH}"
            git commit -m "ci: update backend-deployment image to ${IMAGE_TAG}"
            git push --set-upstream origin "${BRANCH}"
            echo "Pushed manifest update to branch ${BRANCH}"
          fi

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "${KUBE_CONFIG_DATA:-}" ]; then
            echo "KUBE_CONFIG secret is not set; skipping deployment";
            exit 1;
          fi
          echo "Decoding kubeconfig..."
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > kubeconfig
          mkdir -p ~/.kube
          mv kubeconfig ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.3'

      - name: Deploy backend manifest
        run: |
          kubectl apply -f deploy/backend-deployment.yaml
          kubectl rollout status deployment/travel-together-backend --timeout=120s || true

      - name: Create PR for manifest update (if branch present)
        id: create_pr
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/update-backend-image-${{ env.IMAGE_TAG }}
          title: "ci: update backend-deployment image to ${{ env.IMAGE_TAG }}"
          body: "Automatically generated by CI to update backend image to `${{ env.IMAGE_TAG }}`"
          base: main
          labels: automated,ci
          commit-message: "ci: update backend-deployment image to ${{ env.IMAGE_TAG }}"

      - name: Enable auto-merge for the PR (if created)
        if: steps.create_pr.outputs.pull_request_number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.create_pr.outputs.pull_request_number }}
          merge-method: squash
