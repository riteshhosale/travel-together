apiVersion: v1
kind: Service
metadata:
  name: {{ include "travel-together.fullname" . | trunc 63 | trimSuffix "-" }}
  labels:
    app: {{ include "travel-together.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    app: {{ include "travel-together.name" . }}
