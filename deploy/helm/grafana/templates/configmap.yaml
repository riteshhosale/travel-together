apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "travel-together-grafana.fullname" . }}-config
data:
  provisioning-datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.prometheus.url }}
        isDefault: true
        editable: false

  provisioning-dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'travel-together-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards

  travel-together-backend-dashboard.json: |
{{ .Values.dashboards.travelTogetherBackend | indent 4 }}
